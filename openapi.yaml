openapi: 3.1.0

info:
  title: AI BAP API

  version: 1.0.0

  description: |

    I use this contract to define the first API boundaries for AI BAP,

    my AI-Powered Business Analysis Platform. This contract covers health checks, projects, requirements, and

    user story management. AI generation and delivery workflows will

    be introduced in subsequent contract revisions.

servers:
  - url: http://localhost:8000

    description: Local development

security:
  - DemoAccessToken: []

tags:
  - name: Health

  - name: Projects

  - name: Requirements

  - name: User Stories

paths:
  /api/v1/health:
    get:
      tags: [Health]

      operationId: getHealth

      summary: Check API health

      security: []

      responses:
        "200":
          description: Service is available

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/projects:
    get:
      tags: [Projects]

      operationId: listProjects

      summary: List projects

      parameters:
        - $ref: "#/components/parameters/Limit"

        - $ref: "#/components/parameters/Offset"

      responses:
        "200":
          description: Paginated project results

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"

        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Projects]

      operationId: createProject

      summary: Create a project

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"

      responses:
        "201":
          description: Project created

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    get:
      tags: [Projects]

      operationId: getProject

      summary: Get a project

      responses:
        "200":
          description: Project details

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Projects]

      operationId: updateProject

      summary: Update a project

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"

      responses:
        "200":
          description: Updated project

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/NotFound"

        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/requirements:
    get:
      tags: [Requirements]

      operationId: listRequirements

      summary: List requirements for a project

      parameters:
        - name: project_id

          in: query

          required: true

          schema:
            type: string

            format: uuid

        - $ref: "#/components/parameters/Limit"

        - $ref: "#/components/parameters/Offset"

      responses:
        "200":
          description: Paginated requirement results

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementListResponse"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/NotFound"

        "422":
          $ref: "#/components/responses/ValidationError"

    post:
      tags: [Requirements]

      operationId: createRequirement

      summary: Create a requirement

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementCreate"

      responses:
        "201":
          description: Requirement created

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/NotFound"

        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/requirements/{requirement_id}:
    parameters:
      - $ref: "#/components/parameters/RequirementId"

    get:
      tags: [Requirements]

      operationId: getRequirement

      summary: Get a requirement

      responses:
        "200":
          description: Requirement details

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Requirements]

      operationId: updateRequirement

      summary: Update a requirement

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementUpdate"

      responses:
        "200":
          description: Updated requirement

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/NotFound"

        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/user-stories:
    get:
      tags: [User Stories]
      operationId: listUserStories
      summary: List user stories for a requirement
      parameters:
        - name: requirement_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated user story results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [User Stories]
      operationId: createUserStory
      summary: Create a user story for a requirement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStoryCreate"
      responses:
        "201":
          description: User story created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/user-stories/{story_id}:
    parameters:
      - $ref: "#/components/parameters/StoryId"
    get:
      tags: [User Stories]
      operationId: getUserStory
      summary: Get a user story
      responses:
        "200":
          description: User story details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [User Stories]
      operationId: updateUserStory
      summary: Update a user story and its acceptance criteria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStoryUpdate"
      responses:
        "200":
          description: Updated user story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List tasks for a user story
      parameters:
        - name: story_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated task results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task for a user story
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/tasks/{task_id}:
    parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get a task by ID
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Update a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

components:
  securitySchemes:
    DemoAccessToken:
      type: http

      scheme: bearer

      bearerFormat: Opaque

      description: |

        I require a configured demo access token for non-health API operations.

        This is a temporary single-user safeguard, not a multi-user identity system.

        I will not embed credentials in the frontend or expose unrestricted

        write endpoints publicly. Production access requires a suitable gateway

        or stronger authentication mechanism.

  parameters:
    Limit:
      name: limit

      in: query

      schema:
        type: integer

        minimum: 1

        maximum: 100

        default: 20

    Offset:
      name: offset

      in: query

      schema:
        type: integer

        minimum: 0

        default: 0

    ProjectId:
      name: project_id

      in: path

      required: true

      schema:
        type: string

        format: uuid

    RequirementId:
      name: requirement_id

      in: path

      required: true

      schema:
        type: string

        format: uuid

    StoryId:
      name: story_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Request cannot be processed

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Missing or invalid access credentials

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource does not exist

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: Request validation failed

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object

      additionalProperties: false

      required: [status]

      properties:
        status:
          type: string

          enum: [ok]

    ErrorResponse:
      type: object

      additionalProperties: false

      required: [code, message]

      properties:
        code:
          type: string

        message:
          type: string

        details:
          type: array

          items:
            type: object

            additionalProperties: true

    ProjectStatus:
      type: string

      enum: [planned, active, on_hold, completed]

    RequirementStatus:
      type: string

      enum: [draft, in_review, approved, rejected]

    RequirementPriority:
      type: string

      enum: [low, medium, high, critical]

    UserStoryStatus:
      type: string
      description: Review and approval status of a user story.
      enum: [draft, in_review, approved, rejected]

    ProjectCreate:
      type: object

      additionalProperties: false

      required: [name]

      properties:
        name:
          type: string

          minLength: 1

          maxLength: 120

        description:
          type: string

          maxLength: 2000

        status:
          $ref: "#/components/schemas/ProjectStatus"

    ProjectUpdate:
      type: object

      additionalProperties: false

      minProperties: 1

      properties:
        name:
          type: string

          minLength: 1

          maxLength: 120

        description:
          type: string

          maxLength: 2000

        status:
          $ref: "#/components/schemas/ProjectStatus"

    Project:
      allOf:
        - $ref: "#/components/schemas/ProjectCreate"

        - type: object

          required: [id, name, status, created_at, updated_at]

          properties:
            id:
              type: string

              format: uuid

            status:
              $ref: "#/components/schemas/ProjectStatus"

            created_at:
              type: string

              format: date-time

            updated_at:
              type: string

              format: date-time

    ProjectListResponse:
      type: object

      additionalProperties: false

      required: [items, total, limit, offset]

      properties:
        items:
          type: array

          items:
            $ref: "#/components/schemas/Project"

        total:
          type: integer

          minimum: 0

        limit:
          type: integer

        offset:
          type: integer

    RequirementCreate:
      type: object

      additionalProperties: false

      required: [project_id, title, description]

      properties:
        project_id:
          type: string

          format: uuid

        title:
          type: string

          minLength: 1

          maxLength: 160

        description:
          type: string

          minLength: 1

          maxLength: 5000

        priority:
          $ref: "#/components/schemas/RequirementPriority"

        status:
          $ref: "#/components/schemas/RequirementStatus"

    RequirementUpdate:
      type: object

      additionalProperties: false

      minProperties: 1

      properties:
        title:
          type: string

          minLength: 1

          maxLength: 160

        description:
          type: string

          minLength: 1

          maxLength: 5000

        priority:
          $ref: "#/components/schemas/RequirementPriority"

        status:
          $ref: "#/components/schemas/RequirementStatus"

    Requirement:
      allOf:
        - $ref: "#/components/schemas/RequirementCreate"

        - type: object

          required:
            [
              id,

              project_id,

              title,

              description,

              priority,

              status,

              created_at,

              updated_at,
            ]

          properties:
            id:
              type: string

              format: uuid

            priority:
              $ref: "#/components/schemas/RequirementPriority"

            status:
              $ref: "#/components/schemas/RequirementStatus"

            created_at:
              type: string

              format: date-time

            updated_at:
              type: string

              format: date-time

    RequirementListResponse:
      type: object

      additionalProperties: false

      required: [items, total, limit, offset]

      properties:
        items:
          type: array

          items:
            $ref: "#/components/schemas/Requirement"

        total:
          type: integer

          minimum: 0

        limit:
          type: integer

        offset:
          type: integer

    UserStoryCreate:
      type: object
      additionalProperties: false
      required: [requirement_id, title, description, acceptance_criteria]
      properties:
        requirement_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 1
          maxLength: 5000
          description: User story narrative, preferably As a / I want / So that.
        acceptance_criteria:
          type: array
          description: Editable acceptance criteria belonging to this story.
          items:
            type: string
            minLength: 1
            maxLength: 1000
          maxItems: 30
        status:
          $ref: "#/components/schemas/UserStoryStatus"

    UserStoryUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          minLength: 1
          maxLength: 5000
        acceptance_criteria:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 1000
          maxItems: 30
        status:
          $ref: "#/components/schemas/UserStoryStatus"

    UserStory:
      allOf:
        - $ref: "#/components/schemas/UserStoryCreate"
        - type: object
          required:
            [
              id,
              requirement_id,
              title,
              description,
              acceptance_criteria,
              status,
              created_at,
              updated_at,
            ]
          properties:
            id:
              type: string
              format: uuid
            status:
              $ref: "#/components/schemas/UserStoryStatus"
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    UserStoryListResponse:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserStory"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0

    TaskStatus:
      type: string
      description: Current workflow status of a development task.
      enum:
        - todo
        - in_progress
        - in_review
        - done

    TaskCreate:
      type: object
      additionalProperties: false
      required: [story_id, title]
      properties:
        story_id:
          type: string
          format: uuid
          description: ID of the user story associated with this task.
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 5000
        status:
          $ref: "#/components/schemas/TaskStatus"

    TaskUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 5000
        status:
          $ref: "#/components/schemas/TaskStatus"

    Task:
      type: object
      additionalProperties: false
      required:
        - id
        - story_id
        - title
        - description
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        story_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 5000
        status:
          $ref: "#/components/schemas/TaskStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskListResponse:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
