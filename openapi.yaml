openapi: 3.1.0

info:
  title: AI BAP API

  version: 1.0.0

  description: |

    I use this contract to define the first API boundaries for AI BAP,

    my AI-Powered Business Analysis Platform. This contract covers health checks,
    JWT authentication, projects, requirements, user story management, AI draft
    generation, approval decisions, audit history, and delivery workflows.

servers:
  - url: http://localhost:8000

    description: Local development

security:
  - JWTBearer: []

tags:
  - name: Health

  - name: Authentication

  - name: Projects

  - name: Requirements

  - name: User Stories

  - name: User Story Approvals

paths:
  /api/v1/health:
    get:
      tags: [Health]

      operationId: getHealth

      summary: Check API health

      security: []

      responses:
        "200":
          description: Service is available

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Register a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegister"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLogin"
      responses:
        "200":
          description: JWT access token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getMyProfile
      summary: Get my profile
      responses:
        "200":
          description: Authenticated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/projects:
    get:
      tags: [Projects]

      operationId: listProjects

      summary: List projects

      parameters:
        - $ref: "#/components/parameters/Limit"

        - $ref: "#/components/parameters/Offset"

      responses:
        "200":
          description: Paginated project results

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"

        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Projects]

      operationId: createProject

      summary: Create a project

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"

      responses:
        "201":
          description: Project created

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"

    get:
      tags: [Projects]

      operationId: getProject

      summary: Get a project

      responses:
        "200":
          description: Project details

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Projects]

      operationId: updateProject

      summary: Update a project

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"

      responses:
        "200":
          description: Updated project

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/NotFound"

        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/requirements:
    get:
      tags: [Requirements]

      operationId: listRequirements

      summary: List requirements for a project

      parameters:
        - name: project_id

          in: query

          required: true

          schema:
            type: string

            format: uuid

        - $ref: "#/components/parameters/Limit"

        - $ref: "#/components/parameters/Offset"

      responses:
        "200":
          description: Paginated requirement results

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementListResponse"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/NotFound"

        "422":
          $ref: "#/components/responses/ValidationError"

    post:
      tags: [Requirements]

      operationId: createRequirement

      summary: Create a requirement

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementCreate"

      responses:
        "201":
          description: Requirement created

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementResponse"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/NotFound"

        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/requirements/{requirement_id}:
    parameters:
      - $ref: "#/components/parameters/RequirementId"

    get:
      tags: [Requirements]

      operationId: getRequirement

      summary: Get a requirement

      responses:
        "200":
          description: Requirement details

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementResponse"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Requirements]

      operationId: updateRequirement

      summary: Update a requirement

      requestBody:
        required: true

        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementUpdate"

      responses:
        "200":
          description: Updated requirement

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementResponse"

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

        "404":
          $ref: "#/components/responses/NotFound"

        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/user-stories:
    get:
      tags: [User Stories]
      operationId: listUserStories
      summary: List user stories for a requirement
      parameters:
        - name: requirement_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated user story results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [User Stories]
      operationId: createUserStory
      summary: Create a user story for a requirement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStoryCreate"
      responses:
        "201":
          description: User story created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/user-stories/generate:
    post:
      tags: [User Stories]
      operationId: generateUserStoryDraft
      summary: Generate an unsaved AI user story draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AIUserStoryGenerateRequest"
      responses:
        "200":
          description: AI-generated draft requiring human review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIUserStoryGenerateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/user-stories/{story_id}:
    parameters:
      - $ref: "#/components/parameters/StoryId"
    get:
      tags: [User Stories]
      operationId: getUserStory
      summary: Get a user story
      responses:
        "200":
          description: User story details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [User Stories]
      operationId: updateUserStory
      summary: Update a user story and its acceptance criteria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStoryUpdate"
      responses:
        "200":
          description: Updated user story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/user-stories/{story_id}/approve:
    parameters:
      - $ref: "#/components/parameters/StoryId"
    post:
      tags: [User Story Approvals]
      operationId: approveUserStory
      summary: Approve a user story in review
      responses:
        "200":
          description: Approved user story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/user-stories/{story_id}/reject:
    parameters:
      - $ref: "#/components/parameters/StoryId"
    post:
      tags: [User Story Approvals]
      operationId: rejectUserStory
      summary: Reject a user story in review
      responses:
        "200":
          description: Rejected user story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStoryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/user-stories/{story_id}/audit:
    parameters:
      - $ref: "#/components/parameters/StoryId"
    get:
      tags: [User Story Approvals]
      operationId: getUserStoryAuditHistory
      summary: Get user story approval audit history
      responses:
        "200":
          description: Immutable approval and rejection audit history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStoryApprovalAuditListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List tasks for a user story
      parameters:
        - name: story_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated task results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task for a user story
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/tasks/{task_id}:
    parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get a task by ID
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Update a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/sprints:
    get:
      tags: [Sprints]
      operationId: listSprints
      summary: List sprints for a project
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated sprint results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SprintListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    post:
      tags: [Sprints]
      operationId: createSprint
      summary: Create a sprint for a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SprintCreate"
      responses:
        "201":
          description: Sprint created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sprint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/sprints/{sprint_id}:
    parameters:
      - name: sprint_id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Sprints]
      operationId: getSprint
      summary: Get a sprint by ID
      responses:
        "200":
          description: Sprint details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sprint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    patch:
      tags: [Sprints]
      operationId: updateSprint
      summary: Update a sprint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SprintUpdate"
      responses:
        "200":
          description: Updated sprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sprint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

components:
  securitySchemes:
    JWTBearer:
      type: http
      scheme: bearer
      description: JWT bearer token required to access protected API endpoints.

  parameters:
    Limit:
      name: limit

      in: query

      schema:
        type: integer

        minimum: 1

        maximum: 100

        default: 20

    Offset:
      name: offset

      in: query

      schema:
        type: integer

        minimum: 0

        default: 0

    ProjectId:
      name: project_id

      in: path

      required: true

      schema:
        type: string

        format: uuid

    RequirementId:
      name: requirement_id

      in: path

      required: true

      schema:
        type: string

        format: uuid

    StoryId:
      name: story_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Request cannot be processed

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Missing or invalid access credentials

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Authenticated user does not have permission to perform this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Request conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ServiceUnavailable:
      description: A dependent service is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource does not exist

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ValidationError:
      description: Request validation failed

      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object

      additionalProperties: false

      required: [status]

      properties:
        status:
          type: string

          enum: [healthy]

    ErrorResponse:
      type: object

      additionalProperties: false

      required: [detail]

      properties:
        detail:
          anyOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true

    ProjectStatus:
      type: string

      enum: [planned, active, on_hold, completed]

    RequirementStatus:
      type: string

      enum: [draft, in_review, approved, rejected]

    RequirementPriority:
      type: string

      enum: [low, medium, high, critical]

    UserStoryStatus:
      type: string
      description: Review and approval status of a user story.
      enum: [draft, in_review, approved, rejected]

    RecordCreator:
      type: object
      additionalProperties: false
      required: [record_number, full_name]
      properties:
        record_number:
          type: string
          pattern: "^USR-[0-9]{3,}$"
          readOnly: true
        full_name:
          type: string
          maxLength: 160
          readOnly: true

    UserRegister:
      type: object
      required: [email, full_name, password]
      properties:
        email:
          type: string
          format: email
        full_name:
          type: string
          minLength: 2
          maxLength: 160
        password:
          type: string
          minLength: 12
          maxLength: 128

    UserLogin:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    UserResponse:
      type: object
      required: [id, record_number, email, full_name, role, is_active]
      properties:
        id:
          type: string
          format: uuid
        record_number:
          type: string
          pattern: "^USR-[0-9]{3,}$"
          readOnly: true
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
        is_active:
          type: boolean

    TokenResponse:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          default: bearer

    ProjectCreate:
      type: object

      additionalProperties: false

      required: [name]

      properties:
        name:
          type: string

          minLength: 1

          maxLength: 120

        description:
          type: string

          maxLength: 2000

        status:
          $ref: "#/components/schemas/ProjectStatus"

    ProjectUpdate:
      type: object

      additionalProperties: false

      minProperties: 1

      properties:
        name:
          type: string

          minLength: 1

          maxLength: 120

        description:
          type: string

          maxLength: 2000

        status:
          $ref: "#/components/schemas/ProjectStatus"

    ProjectResponse:
      allOf:
        - $ref: "#/components/schemas/ProjectCreate"

        - type: object

          required: [id, record_number, name, status, created_by, created_at, updated_at]

          properties:
            id:
              type: string

              format: uuid

            record_number:
              type: string

              pattern: "^PRJ-[0-9]{3,}$"

              readOnly: true

            created_by:
              description: >-
                Creator identity when known; null for historical records whose
                creator was not recorded or is no longer available.
              anyOf:
                - $ref: "#/components/schemas/RecordCreator"
                - type: "null"

              readOnly: true

            status:
              $ref: "#/components/schemas/ProjectStatus"

            created_at:
              type: string

              format: date-time

            updated_at:
              type: string

              format: date-time

    ProjectListResponse:
      type: object

      additionalProperties: false

      required: [items, total, limit, offset]

      properties:
        items:
          type: array

          items:
            $ref: "#/components/schemas/ProjectResponse"

        total:
          type: integer

          minimum: 0

        limit:
          type: integer

        offset:
          type: integer

    RequirementCreate:
      type: object

      additionalProperties: false

      required: [project_id, title, description]

      properties:
        project_id:
          type: string

          format: uuid

        title:
          type: string

          minLength: 1

          maxLength: 160

        description:
          type: string

          minLength: 1

          maxLength: 5000

        priority:
          $ref: "#/components/schemas/RequirementPriority"

        status:
          $ref: "#/components/schemas/RequirementStatus"

    RequirementUpdate:
      type: object

      additionalProperties: false

      minProperties: 1

      properties:
        title:
          type: string

          minLength: 1

          maxLength: 160

        description:
          type: string

          minLength: 1

          maxLength: 5000

        priority:
          $ref: "#/components/schemas/RequirementPriority"

        status:
          $ref: "#/components/schemas/RequirementStatus"

    RequirementResponse:
      allOf:
        - $ref: "#/components/schemas/RequirementCreate"

        - type: object

          required:
            [
