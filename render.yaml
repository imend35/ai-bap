databases:
  - name: ai-bap-postgres
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: ai_bap
    user: ai_bap_user
    ipAllowList: []

services:
  - type: web
    runtime: docker
    name: ai-bap-api
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: docker/backend/Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /api/v1/health
    preDeployCommand: python /usr/local/bin/migrate_production.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-bap-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PORT
        value: "10000"

  - type: web
    runtime: static
    name: ai-bap-frontend
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: off
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: ai-bap-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
