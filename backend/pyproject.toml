
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-bap-backend"
version = "0.1.0"
description = "Backend API for the AI-Powered Business Analysis Platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic-settings>=2.8,<3.0"
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.11,<1.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
