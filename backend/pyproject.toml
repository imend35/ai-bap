
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-bap-backend"
version = "0.1.0"
description = "Backend API for the AI-Powered Business Analysis Platform"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic-settings>=2.8,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.15,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "openai>=2,<3",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.10,<3",
    "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
    "ruff>=0.11,<1.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
