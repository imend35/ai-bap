databases:
  - name: ai-bap-free-postgres
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: ai_bap
    user: ai_bap_user
    ipAllowList: []

services:
  - type: web
    runtime: docker
    name: ai-bap-free-api
    plan: free
    region: frankfurt
    dockerfilePath: docker/backend/Dockerfile
    dockerContext: .
    dockerCommand: python /usr/local/bin/start_api_free.py
    autoDeployTrigger: "off"
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-bap-free-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PORT
        value: "10000"

  - type: web
    runtime: static
    name: ai-bap-free-frontend
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: "off"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: ai-bap-free-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
