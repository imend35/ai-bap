name: ai-bap-test

services:
  db-test:
    image: postgres:16
    restart: "no"

    environment:
      POSTGRES_DB: ai_bap_test
      POSTGRES_USER: ai_bap_test_user
      POSTGRES_PASSWORD: ${AI_BAP_TEST_POSTGRES_PASSWORD:?Set a unique test-only password in your shell.}

    ports:
      - "127.0.0.1:55432:5432"

    volumes:
      - ai_bap_test_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ai_bap_test_user -d ai_bap_test
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ai_bap_test_data:
