name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test -- --run

      - name: Build frontend
        run: npm run build

      - name: Lint frontend
        run: npm run lint

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    env:
      AI_BAP_TEST_MODE: "true"
      AI_BAP_TEST_DATABASE_CONFIRMATION: isolated-postgresql-acknowledged
      AI_BAP_ALEMBIC_TARGET: isolated-test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "55432"
      POSTGRES_DB: ai_bap_test
      POSTGRES_USER: ai_bap_test_user
      AI_BAP_TEST_POSTGRES_PASSWORD: ai_bap_ci_test_password
      POSTGRES_PASSWORD: ai_bap_ci_test_password
      JWT_SECRET_KEY: ci-only-jwt-signing-key-not-for-production-use
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ai_bap_test
          POSTGRES_USER: ai_bap_test_user
          POSTGRES_PASSWORD: ai_bap_ci_test_password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ai_bap_test_user -d ai_bap_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --extra dev --frozen

      - name: Apply migrations to ephemeral test database
        run: uv run python scripts/run_isolated_test_alembic.py upgrade head

      - name: Run backend tests
        run: uv run --no-sync pytest -q --tb=short

      - name: Lint backend
        run: uv run --no-sync ruff check app tests migrations/versions
